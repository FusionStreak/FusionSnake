[workspace]
members = [
    "crates/fusion-models",
    "crates/fusion-core",
    "crates/fusion-engine-standard",
    "crates/fusion-arena",
]
resolver = "2"

[workspace.package]
# Keep in sync with rust-toolchain.toml.
rust-version = "1.100"

[package]
authors = ["Sayfullah Eid"]
name = "fusion-snake"
version = "0.6.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"
repository = "https://github.com/FusionStreak/FusionSnake.git"
readme = "README.md"
keywords = ["battlesnake"]
description = """
A simple Battlesnake written in Rust
"""

[dependencies]
actix-web = "^4.14"
actix-cors = "^0.7"
tokio = { version = "^1", features = ["sync", "fs", "io-util"] }
futures-util = "^0.3"
fusion-models = { path = "crates/fusion-models" }
fusion-core = { path = "crates/fusion-core" }
fusion-engine-standard = { path = "crates/fusion-engine-standard" }
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.151"
sqlx = { version = "^0.9", features = ["runtime-tokio", "sqlite"] }
log = "^0.4.33"
tracing-subscriber = { version = "^0.3", features = ["json", "env-filter"] }
chrono = { version = "^0.4", features = ["serde"] }
utoipa = { version = "6", features = ["actix_extras"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
needless_for_each = "allow"                  # false positive from utoipa OpenApi derive macro
