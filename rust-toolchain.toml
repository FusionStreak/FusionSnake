# Pinned so CI and local builds use the same compiler and Clippy lints.
# The weekly `rust-canary` workflow opens a PR bumping this, `rust-version` in
# Cargo.toml and the Dockerfile together once latest stable passes. To bump by
# hand, run `.github/scripts/bump-rust-toolchain.sh <version>`.
[toolchain]
channel = "1.100.0"
components = ["clippy", "rustfmt"]
profile = "minimal"
