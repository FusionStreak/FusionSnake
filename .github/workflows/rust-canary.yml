name: Rust canary

# Weekly preview of the next toolchain bump: runs Clippy and tests on the
# latest stable Rust instead of the version pinned in rust-toolchain.toml.
# Not a required check. A failure here means new lints or breakage will need
# fixing when the pin is bumped, not that main is broken.
#
# When those pass on a newer stable, opens a PR bumping every version pin.
# PRs created with GITHUB_TOKEN don't start workflows, so run CI on them by hand.

on:
    schedule:
        - cron: "0 6 * * 1" # Mondays 06:00 UTC, alongside Dependabot
    workflow_dispatch:

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: 0

jobs:
    latest-stable:
        name: Clippy + test on latest stable
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.stable.outputs.version }}
        steps:
            - uses: actions/checkout@v7

            - uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  toolchain: stable
                  components: clippy
                  cache: false
                  rustflags: ""

            # Make the override win over rust-toolchain.toml for every cargo call.
            - run: rustup override set stable

            - id: stable
              run: |
                  rustc --version
                  echo "version=$(rustc --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

            - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

            - run: cargo test --workspace --all-features --locked

    open-bump-pr:
        name: Open toolchain bump PR
        needs: latest-stable
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        env:
            GH_TOKEN: ${{ github.token }}
            VERSION: ${{ needs.latest-stable.outputs.version }}
            BRANCH: chore/rust-toolchain-${{ needs.latest-stable.outputs.version }}
        steps:
            - uses: actions/checkout@v7

            - name: Decide whether a bump is needed
              id: check
              run: |
                  pin=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
                  rc=0
                  bash .github/scripts/bump-rust-toolchain.sh --is-newer "$VERSION" "$pin" || rc=$?
                  if [ "$rc" -eq 1 ]; then
                      echo "Pin $pin is already up to date with stable $VERSION."
                      exit 0
                  elif [ "$rc" -ne 0 ]; then
                      exit "$rc"
                  fi
                  if ! docker manifest inspect "rust:$VERSION-slim" > /dev/null 2>&1; then
                      echo "rust:$VERSION-slim isn't published yet. Retrying next run."
                      exit 0
                  fi
                  # A separate statement so an API failure stops the job.
                  prs=$(gh pr list --head "$BRANCH" --state all --json number --jq '.[].number')
                  if [ -n "$prs" ]; then
                      echo "A PR for $BRANCH already exists or was closed."
                      exit 0
                  fi
                  # A branch with no PR means an earlier run failed after pushing.
                  if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" > /dev/null; then
                      echo "action=pr-only" >> "$GITHUB_OUTPUT"
                  else
                      echo "action=branch-and-pr" >> "$GITHUB_OUTPUT"
                  fi

            - name: Open the PR
              if: steps.check.outputs.action != ''
              env:
                  ACTION: ${{ steps.check.outputs.action }}
              run: |
                  if [ "$ACTION" = "branch-and-pr" ]; then
                      bash .github/scripts/bump-rust-toolchain.sh "$VERSION"
                      git config user.name "github-actions[bot]"
                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                      git switch -c "$BRANCH"
                      git add rust-toolchain.toml Cargo.toml src/Dockerfile
                      git commit -m "chore: bump Rust toolchain to $VERSION"
                      git push origin "$BRANCH"
                  fi
                  gh pr create --base main --head "$BRANCH" \
                      --title "chore: bump Rust toolchain to $VERSION" \
                      --body "Updates \`rust-toolchain.toml\`, \`rust-version\` and the Dockerfile image to Rust $VERSION. Clippy and tests passed on this version in \`rust-canary\`.

                  CI doesn't start automatically on this PR. Run it with \`gh workflow run ci.yml --ref $BRANCH\`."
