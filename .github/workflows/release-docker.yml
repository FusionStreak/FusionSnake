name: Publish release Docker image

on:
    release:
        types: [published]

permissions:
    contents: read
    packages: write

jobs:
    docker-release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Extract crate version
              id: crate_version
              run: |
                  VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Validate release tag matches crate version
              run: |
                  TAG_VERSION="${GITHUB_REF_NAME#v}"
                  CARGO_VERSION="${{ steps.crate_version.outputs.version }}"
                  if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
                    echo "ERROR: Cargo.toml version ($CARGO_VERSION) does not match release tag ($TAG_VERSION)"
                    exit 1
                  fi

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository_owner }}/fusionsnake
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and push tagged release image
              uses: docker/build-push-action@v7
              with:
                  context: ./
                  file: ./src/Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
