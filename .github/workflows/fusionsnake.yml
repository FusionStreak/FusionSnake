name: Build and Publish FusionSnake

on:
    push:
        branches: ["main"]
        paths:
            - "src/**"
            - "Cargo.toml"
            - "Cargo.lock"
            - "rust-toolchain.toml"
        tags: ["v*"]
    pull_request:
        branches: ["main"]
        paths:
            - "src/**"
            - "Cargo.toml"
            - "Cargo.lock"
            - "rust-toolchain.toml"

permissions:
    contents: read
    packages: write

jobs:
    docker:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Extract crate version
              id: crate_version
              run: |
                  VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Validate tag matches crate version
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  TAG_VERSION="${GITHUB_REF_NAME#v}"
                  CARGO_VERSION="${{ steps.crate_version.outputs.version }}"
                  if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
                      echo "ERROR: Cargo.toml version ($CARGO_VERSION) does not match git tag ($TAG_VERSION)"
                      exit 1
                  fi

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository_owner }}/fusionsnake
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=ref,event=branch
                      type=sha
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=raw,value=${{ steps.crate_version.outputs.version }},enable={{is_default_branch}}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: ./
                  file: ./src/Dockerfile
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
