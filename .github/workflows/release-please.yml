name: release-please

on:
    push:
        branches:
            - main

permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        steps:
            - name: Create or update release PR
              id: release
              uses: googleapis/release-please-action@v5
              with:
                  token: ${{ github.token }}
                  config-file: .release-please-config.json
                  manifest-file: .release-please-manifest.json
