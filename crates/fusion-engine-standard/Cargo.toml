[package]
name = "fusion-engine-standard"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "^4.14"
fusion-models = { path = "../fusion-models" }
fusion-core = { path = "../fusion-core" }
log = "^0.4.33"
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.151"
tokio = { version = "^1", features = ["sync"] }
utoipa = { version = "6" }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "simulation_bench"
harness = false

[[bench]]
name = "evaluation_bench"
harness = false

[[bench]]
name = "search_bench"
harness = false
